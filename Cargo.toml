[package]
name = "gig"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
clap = { version = "4.6.7", features = ["derive"] }
ignore = "0.4.33"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "process", "time", "fs", "io-util"] }
tree-sitter = "0.27.1"
tree-sitter-rust = "0.24.2"

[dev-dependencies]
tempfile = "3.27.0"
